#
# Banana Pi BPI-R4 Pro support layered on top of Armbian's MT7988/Filogic
# image and boot layout.

# Reuse the proven Filogic GPT, FIP assembly and U-Boot patch stack.
# shellcheck source=config/sources/families/filogic.conf
source "${BASH_SOURCE%/*}/filogic.conf"

# Keep package/config naming compatible with the existing Filogic kernel
# configuration; Pro-only Kconfig additions live in the board hook.
declare -g LINUXFAMILY="filogic"

case "${BRANCH}" in
	current)
		# Exact upstream rc6; board-local patches carry Frank's extensions.
		declare -g KERNELSOURCE='https://github.com/torvalds/linux.git'
		declare -g KERNELBRANCH='commit:a90ee4305c4a5df72c11b31dacfdc76e00fcf78a'
		declare -g KERNEL_MAJOR_MINOR='7.3'
		declare -g LINUXCONFIG='linux-filogic-current'

		declare -g KERNELPATCHDIR='bpi-r4pro8x-7.3'

		# The 8X is the 8 GiB DDR4 variant. Frank's R4-Pro ATF build uses
		# DDR4_4BG_MODE=1 for this memory layout.
		declare -g ATFSOURCE='https://github.com/frank-w/u-boot.git'
		declare -g ATFBRANCH='branch:mtk-atf-2026'
		declare -g ATF_TARGET_MAP="PLAT=mt7988 BOOT_DEVICE=${ATF_BOOT_DEVICE} USE_MKIMAGE=1 BOARD_BGA=1 HAVE_DRAM_OBJ_FILE=yes DRAM_USE_COMB=1 DDR4_4BG_MODE=1 all;;build/mt7988/release/bl2.img build/mt7988/release/bl31.bin"
		;;
	*)
		exit_with_error "BPI-R4 Pro 8X currently supports only BRANCH=current" "${BRANCH}"
		;;
esac


# TF-A 2.14 (Frank's mtk-atf-2026) moved host tools into BUILD_PLAT and
# creates tools/fiptool/fiptool as a compatibility symlink only when the
# top-level "fiptool" target is used. Armbian's generic Filogic postprocess
# still invokes make directly in tools/fiptool, which no longer produces the
# expected binary. Keep this compatibility override local to the R4 Pro family.
function uboot_custom_postprocess() {
	local uboot_source_dir="${SRC}/cache/sources/${BOOTSOURCEDIR}"
	local atf_source_dir="${SRC}/cache/sources/${ATFSOURCEDIR}"
	local fiptool="${atf_source_dir}/tools/fiptool/fiptool"

	if [[ ! -x "${fiptool}" ]]; then
		run_host_command_logged make -C "${atf_source_dir}" PLAT="${BOOT_SOC}" HOSTCC=gcc fiptool
	fi
	[[ -x "${fiptool}" ]] || exit_with_error "R4 Pro TF-A fiptool build failed" "${fiptool}"

	run_host_command_logged rm -f "${uboot_source_dir}/bl2.img"
	run_host_command_logged cp 		"${atf_source_dir}/build/${BOOT_SOC}/release/bl2.img" 		"${uboot_source_dir}/bl2.img"

	run_host_command_logged rm -f "${uboot_source_dir}/u-boot_sdmmc.fip"
	run_host_command_logged "${fiptool}" create 		--soc-fw "${atf_source_dir}/build/${BOOT_SOC}/release/bl31.bin" 		--nt-fw "${uboot_source_dir}/u-boot.bin" 		"${uboot_source_dir}/u-boot_sdmmc.fip"
}

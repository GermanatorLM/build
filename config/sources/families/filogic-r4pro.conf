#
# Banana Pi BPI-R4 Pro support layered on top of Armbian's MT7988/Filogic
# image and boot layout.

# Reuse the proven Filogic GPT, FIP assembly and U-Boot patch stack.
# shellcheck source=config/sources/families/filogic.conf
source "${BASH_SOURCE%/*}/filogic.conf"

# Keep package/config naming compatible with the existing Filogic kernel
# configuration; Pro-only Kconfig additions live in the board hook.
declare -g LINUXFAMILY="filogic"

case "${BRANCH}" in
	current)
		# Frank Wunderlich's R4/R4-Pro tree contains the 8X base DT, storage
		# overlays, MxL862xx switch and AS21xxx PHY support.
		declare -g KERNELSOURCE='https://github.com/frank-w/BPI-Router-Linux.git'
		declare -g KERNELBRANCH='branch:6.18-main'
		declare -g KERNEL_MAJOR_MINOR='6.18'
		declare -g LINUXCONFIG='linux-filogic-current'

		# Armbian currently has Filogic patch archives for 6.12/6.16, not 6.18.
		# Frank's 6.18 tree already carries the required R4-Pro work.
		declare -g DISABLE_KERNEL_PATCHES='yes'
		declare -g KERNELPATCHDIR=''

		# The 8X is the 8 GiB DDR4 variant. Frank's R4-Pro ATF build uses
		# DDR4_4BG_MODE=1 for this memory layout.
		declare -g ATFSOURCE='https://github.com/frank-w/u-boot.git'
		declare -g ATFBRANCH='branch:mtk-atf-2026'
		declare -g ATF_TARGET_MAP="PLAT=mt7988 BOOT_DEVICE=${ATF_BOOT_DEVICE} USE_MKIMAGE=1 BOARD_BGA=1 HAVE_DRAM_OBJ_FILE=yes DRAM_USE_COMB=1 DDR4_4BG_MODE=1 all;;build/mt7988/release/bl2.img build/mt7988/release/bl31.bin"
		;;
	*)
		exit_with_error "BPI-R4 Pro 8X currently supports only BRANCH=current" "${BRANCH}"
		;;
esac

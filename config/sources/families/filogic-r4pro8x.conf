source "${SRC}/config/sources/families/filogic.conf"

declare -g R4PRO_BOOT_MEDIA="${R4PRO_BOOT_MEDIA:-sd}"
case "${R4PRO_BOOT_MEDIA}" in
	sd) declare -g BOOTCONFIG="mt7988a_bpir4_sd_defconfig" ATF_BOOT_DEVICE=sdmmc ;;
	emmc) declare -g BOOTCONFIG="mt7988a_bpir4_emmc_defconfig" ATF_BOOT_DEVICE=emmc ;;
	*) exit_with_error "Unsupported R4 Pro boot medium" "${R4PRO_BOOT_MEDIA}" ;;
esac
declare -g LINUXFAMILY=bananapir4pro8x
declare -g KERNELSOURCE="https://github.com/torvalds/linux.git"
declare -g KERNELBRANCH="commit:c03c1a14507dfaf8b856c2608f9ac216021fc222"
declare -g KERNEL_MAJOR_MINOR="7.3"
declare -g KERNELPATCHDIR="archive/bananapir4pro8x-7.3"
declare -g LINUXCONFIG="linux-bananapir4pro8x-edge"
declare -g BOOTSOURCE="https://github.com/frank-w/u-boot.git"
declare -g BOOTBRANCH="commit:6d0874983b52980d02b2b98e2009ccc8e1117e0d"
declare -g BOOTPATCHDIR="u-boot-r4pro8x"
declare -g ATFSOURCE="https://github.com/frank-w/u-boot.git"
declare -g ATFBRANCH="commit:5ef7f379d5d92bd5d1733c10c5fbb2019a0a14b1"
declare -g ATFPATCHDIR="atf-r4pro8x"
declare -g ATF_TARGET_MAP="PLAT=mt7988 BOOT_DEVICE=${ATF_BOOT_DEVICE} USE_MKIMAGE=1 DRAM_USE_COMB=1 DDR4_4BG_MODE=1 all;;build/mt7988/release/bl2.img build/mt7988/release/bl31.bin"
declare -g UBOOT_TARGET_MAP=";;u-boot.bin u-boot_${R4PRO_BOOT_MEDIA}.fip bl2.img"
declare -g OVERLAY_PREFIX="mt7988a-bananapi-bpi-r4-pro"
declare -g DEFAULT_OVERLAYS="${R4PRO_BOOT_MEDIA},8x-lan-phy"
declare -g R4PRO_NVME_SLOT="${R4PRO_NVME_SLOT:-none}"
case "${R4PRO_NVME_SLOT}" in
	none) ;;
	cn13|cn14) DEFAULT_OVERLAYS+=",${R4PRO_NVME_SLOT}" ;;
	*) exit_with_error "Unsupported R4 Pro NVMe slot" "${R4PRO_NVME_SLOT}" ;;
esac
declare -g BOOTSCRIPT=""
# MT7988 does not use the TF-A shared-library submodules.
declare -g GIT_SKIP_SUBMODULES=yes

function post_config_uboot_target__r4pro8x_extlinux() {
	run_host_command_logged ./scripts/config --enable DISTRO_DEFAULTS --enable CMD_SYSBOOT \
		--enable OF_LIBFDT_OVERLAY --disable ENV_IS_IN_MMC --enable ENV_IS_NOWHERE \
		--enable DM_RNG --enable RNG_MTK_V2
	cat > uEnv_r4.txt <<-'ENV'
		bootcmd=sysboot mmc 0:5 any 0x46000000 /boot/extlinux/extlinux.conf
		bootdelay=3
		kernel_addr_r=0x46000000
		ramdisk_addr_r=0x48000000
		fdt_addr_r=0x62000000
		fdtoverlay_addr_r=0x62080000
		scriptaddr=0x43000000
		pxefile_addr_r=0x44000000
	ENV
}

function uboot_custom_postprocess() {
	local atf="${SRC}/cache/sources/${ATFSOURCEDIR}"
	local boot="${SRC}/cache/sources/${BOOTSOURCEDIR}"
	run_host_command_logged make -C "${atf}" PLAT=mt7988 fiptool HOSTCC=gcc
	run_host_command_logged cp "${atf}/build/mt7988/release/bl2.img" "${boot}/bl2.img"
	run_host_command_logged "${atf}/build/mt7988/release/tools/fiptool/fiptool" create \
		--soc-fw "${atf}/build/mt7988/release/bl31.bin" --nt-fw "${boot}/u-boot.bin" \
		"${boot}/u-boot_${R4PRO_BOOT_MEDIA}.fip"
	run_host_command_logged cp "${atf}/docs/license.rst" "${atftempdir:?}/license.md"
}

function write_uboot_platform() {
	# This writer supports SD image creation only. eMMC needs a separate installer.
	[[ -f "$1/u-boot_sd.fip" ]] || { echo "eMMC installation is not validated" >&2; return 1; }
	[[ "$2" =~ ^/dev/loop[0-9]+$ && -b "$2" ]] || {
		echo "R4 Pro bootloader writing supports build loop devices only" >&2
		return 1
	}
	dd if="$1/bl2.img" of="$2" bs=512 seek=34 conv=notrunc status=none || return
	dd if="$1/u-boot_sd.fip" of="$2" bs=512 seek=13312 conv=notrunc status=none || return
	local start size
	read -r start size < <(parted -m "$2" unit s print | awk -F: '$1 ~ /^[0-9]+$/ {s=$2; n=$4} END {gsub(/s/, "", s); gsub(/s/, "", n); print s,n}')
	[[ "$start" =~ ^[0-9]+$ && "$size" =~ ^[0-9]+$ ]] || return 1
	dd if="${SRC}/packages/blobs/filogic/gpt" of="$2" conv=notrunc status=none || return
	printf '%s,%s\n' "$start" "$size" | sfdisk --no-reread --append "$2" || return
	sfdisk --no-reread --part-type "$2" 4 0FC63DAF-8483-4772-8E79-3D69D8477DE4
}

function pre_umount_final_image__700_filogic_export_flash_bins() {
	: "${version:?}"
	local dirs=("${MOUNT}"/usr/lib/linux-u-boot-*"${BOARD}"*)
	[[ ${#dirs[@]} == 1 && -d "${dirs[0]}" ]] || return 1
	run_host_command_logged cp "${dirs[0]}/bl2.img" "${DESTIMG}/${version}.${R4PRO_BOOT_MEDIA}.bl2.img"
	run_host_command_logged cp "${dirs[0]}/u-boot_${R4PRO_BOOT_MEDIA}.fip" \
		"${DESTIMG}/${version}.${R4PRO_BOOT_MEDIA}.fip.bin"
}
